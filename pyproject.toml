[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "council"
version = "0.1.0"
description = "A multi-model coding council: Claude, Kimi K2, and GLM-5.2 collaborate on coding tasks under fixed roles, driven from a mission-control dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sse-starlette>=2.1",
    "rich>=13.7",
]

# The real model backends are an OPTIONAL extra. The core framework, API,
# tools, and full test suite run without these — the MockCouncil engine
# stands in for live models. Install with: pip install -e ".[real]"
# (CrewAI/litellm may lag the newest Python; the core never depends on them.)
[project.optional-dependencies]
# litellm is the live engine. CrewAI is a separate extra because it cannot
# install on Python 3.14 (requires <3.14); keep it optional and out of [real].
real = [
    "litellm>=1.40",
]
crewai = [
    "crewai>=0.80",
]
# Live Kalshi read/trade adapter (RSA-PSS request signing).
kalshi = [
    "httpx>=0.27",
    "cryptography>=42",
]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
council = "council.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
