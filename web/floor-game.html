<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Floor — Council Trading Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
<style>
  /* ===== THE FLOOR — 8-bit arcade theme (pixel/CRT) ===== */
  :root{
    --bg:#15082b;--panel:#23114a;--panel2:#2e1860;--line:#5a32b0;--ink:#fdf3ff;--muted:#c4a9ff;--faint:#8a6fc4;
    --accent:#28e0ff;--up:#7cff6b;--down:#ff4d77;--pending:#ffd23f;--pink:#ff5fd2;--purple:#b08bff;
    --mono:"VT323",ui-monospace,monospace;--disp:"Press Start 2P",system-ui,sans-serif;
    --hard:4px 4px 0 #08020f;            /* chunky pixel-block shadow */
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;
    font:18px/1.4 "VT323",ui-monospace,monospace;
    background:
      repeating-linear-gradient(0deg, rgba(176,139,255,.05) 0 1px, transparent 1px 32px),
      repeating-linear-gradient(90deg, rgba(176,139,255,.05) 0 1px, transparent 1px 32px),
      radial-gradient(circle at 50% -10%, #3a1670 0%, #15082b 55%, #0c0420 100%);
    background-attachment:fixed}
  /* CRT scanlines + vignette (purely cosmetic, click-through) */
  body::before{content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.14) 2px 3px);mix-blend-mode:multiply}
  body::after{content:"";position:fixed;inset:0;z-index:9998;pointer-events:none;box-shadow:inset 0 0 160px rgba(0,0,0,.6)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .wrap{width:100%;max-width:1040px;padding:16px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .logo{font-family:var(--disp);font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;
    color:var(--pink);text-shadow:3px 3px 0 #08020f,0 0 14px rgba(255,95,210,.6)}
  .logo b{color:var(--accent);text-shadow:3px 3px 0 #08020f,0 0 12px rgba(40,224,255,.7)}
  .mode{font-family:var(--disp);font-size:9px;letter-spacing:.06em;padding:8px 9px;border:3px solid var(--pending);
    color:var(--pending);background:#3a2a00;box-shadow:var(--hard)}
  .out{margin-left:auto;font-family:var(--disp);font-size:9px;letter-spacing:.04em;color:var(--muted);display:flex;align-items:center}
  .out b{font-family:var(--mono);color:var(--up);font-size:26px;margin-left:8px;text-shadow:0 0 10px rgba(124,255,107,.6)}
  .stop,.toggle{font-family:var(--disp);font-size:9px;letter-spacing:.03em;padding:9px 11px;border:3px solid var(--line);
    background:var(--panel2);color:var(--muted);box-shadow:var(--hard);
    transition:transform .06s,box-shadow .06s,background .15s,color .15s,border-color .15s}
  .toggle:hover,.stop:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #08020f}
  .toggle:active,.stop:active{transform:translate(4px,4px);box-shadow:0 0 0 #08020f}
  .toggle.on{background:#0c3a18;color:var(--up);border-color:var(--up)}
  .toggle.live-on{background:#3a0c1a;color:var(--down);border-color:var(--down)}
  .toggle.arm-on{background:var(--down);color:#1a0006;border-color:#fff;animation:armthrob .5s steps(2) infinite}
  @keyframes armthrob{0%{box-shadow:4px 4px 0 #08020f,0 0 0 rgba(255,77,119,.9)}100%{box-shadow:4px 4px 0 #08020f,0 0 20px rgba(255,77,119,1)}}
  .stop{display:flex;align-items:center;gap:7px;background:var(--down);color:#fff;border-color:#fff}
  .stop[aria-pressed="true"]{background:#3a0c1a;color:var(--down);border-color:var(--down)}

  .stage{position:relative;width:100%}
  canvas{width:100%;aspect-ratio:1000/620;display:block;background:#0b0f16;image-rendering:pixelated;
    border:5px solid var(--purple);box-shadow:var(--hard),inset 0 0 0 2px #08020f}

  /* worker stat tooltip */
  .tip{position:absolute;z-index:5;display:none;background:#1a0b38;border:3px solid var(--accent);
    padding:10px 12px;min-width:172px;pointer-events:none;box-shadow:var(--hard)}
  .tip .nm{font-family:var(--disp);font-size:11px;color:var(--accent)}
  .tip .rl{font-family:var(--mono);font-size:15px;color:var(--muted);margin-bottom:6px}
  .tip .r{display:flex;justify-content:space-between;font-family:var(--mono);font-size:17px;margin:1px 0}
  .tip .r span:first-child{color:var(--faint)}

  /* approvals dock */
  .dock{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .pit-empty{grid-column:1/-1;text-align:center;color:var(--faint);font-family:var(--disp);font-size:9px;line-height:1.9;
    padding:18px;border:3px dashed var(--line);background:rgba(0,0,0,.2)}
  .ticket{background:var(--panel);border:3px solid var(--pending);padding:12px 13px;box-shadow:var(--hard)}
  .ticket .top{display:flex;justify-content:space-between;align-items:center}
  .ticket .who{font-family:var(--disp);font-size:9px;color:var(--muted)}
  .ticket .side{font-family:var(--disp);font-size:9px;padding:4px 7px;border:2px solid currentColor}
  .side.yes{color:var(--up);background:rgba(124,255,107,.12)} .side.no{color:var(--down);background:rgba(255,77,119,.12)}
  .ticket .ti{font-size:20px;margin:9px 0 3px;color:var(--ink)}
  .ticket .meta{font-family:var(--mono);font-size:17px;color:var(--faint);margin-bottom:11px}
  .ticket .acts{display:flex;gap:8px}
  .ticket .acts button{flex:1;border:3px solid #08020f;padding:9px;font-family:var(--disp);font-size:9px;box-shadow:var(--hard);
    transition:transform .06s,box-shadow .06s}
  .ticket .acts button:active{transform:translate(4px,4px);box-shadow:0 0 0 #08020f}
  .ship{background:var(--up);color:#052b13} .reject{background:var(--panel2);color:var(--down);border-color:var(--down)!important}

  .hint{margin-top:14px;font-family:var(--mono);font-size:17px;color:var(--faint);text-align:center}

  /* live activity feed — the server's real event log */
  .feed{margin-top:14px;border:3px solid var(--line);background:var(--panel);box-shadow:var(--hard)}
  .feed h4{margin:0;padding:10px 13px;font-family:var(--disp);font-size:9px;letter-spacing:.06em;
    color:var(--accent);border-bottom:3px solid var(--line);display:flex;align-items:center;gap:8px;background:#1a0b38}
  .feed h4 .dotpulse{width:9px;height:9px;background:var(--up);box-shadow:0 0 8px var(--up);animation:fp .7s steps(2) infinite}
  @keyframes fp{0%{opacity:1}100%{opacity:.2}}
  .feed ul{list-style:none;margin:0;padding:6px 0;max-height:220px;overflow-y:auto}
  .feed li{font-family:var(--mono);font-size:17px;padding:2px 13px;display:flex;gap:10px;color:var(--ink)}
  .feed li .ts{color:var(--faint);flex:none}
  .feed li.ev-order{color:var(--up)} .feed li.ev-fail,.feed li.ev-risk{color:var(--down)}
  .feed li.ev-warn{color:var(--pending)} .feed li.empty{color:var(--faint);justify-content:center}

  .theater{margin-top:14px;border:3px solid var(--pink);background:var(--panel);padding:13px;box-shadow:var(--hard)}
  .theater[hidden]{display:none}
  .theater h4{margin:0 0 12px;font-family:var(--disp);font-size:9px;letter-spacing:.05em;color:var(--pink);display:flex;align-items:center;gap:8px}
  .theater .cols{display:flex;flex-direction:column;gap:10px}
  .turn{border:3px solid var(--line);padding:10px 12px;background:#1a0b38;box-shadow:3px 3px 0 #08020f}
  .turn .hd{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .turn .nm{font-family:var(--disp);font-size:10px;color:var(--accent)}
  .turn .pv{margin-left:auto;font-family:var(--mono);font-size:24px;color:var(--up);text-shadow:0 0 8px rgba(124,255,107,.5)}
  .turn .last{font-family:var(--disp);font-size:7px;color:#08020f;background:var(--pending);padding:3px 5px}
  .turn .msg{font-family:var(--mono);font-size:18px;color:var(--muted);line-height:1.35}
  .verdict{margin-top:12px;font-family:var(--disp);font-size:10px;line-height:1.7;padding:11px;text-align:center;border:3px solid}
  .verdict.place{color:var(--up);background:rgba(124,255,107,.1);border-color:var(--up);text-shadow:0 0 8px rgba(124,255,107,.5)}
  .verdict.skip{color:var(--faint);background:rgba(0,0,0,.25);border-color:var(--line)}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo"><b>◢</b> THE FLOOR</span>
    <span class="mode" id="mode">PAPER</span>
    <span class="out">SHIFT OUTPUT <b class="num" id="out">$0.00</b></span>
    <button class="toggle on" id="auto" aria-pressed="true" title="Auto mode: floor works on its own">AUTO: ON</button>
    <button class="toggle" id="live" aria-pressed="false" title="Mock (free) vs live models (spends tokens)">MODE: MOCK</button>
    <button class="toggle" id="arm" aria-pressed="false" title="Arm REAL autonomous order placement (real money)">ARM $</button>
    <button class="stop" id="stop" aria-pressed="false">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      STOP THE LINE
    </button>
  </header>

  <div class="stage">
    <canvas id="game" width="1000" height="620" aria-label="Trading floor simulation: three model workers move between desks doing tasks"></canvas>
    <div class="tip" id="tip"></div>
  </div>

  <div class="dock" id="dock"></div>

  <section class="theater" id="theater" hidden aria-live="polite">
    <h4><span class="dotpulse"></span> COUNCIL DEBATE — <span id="th-market">—</span></h4>
    <div class="cols" id="th-cols"></div>
    <div class="verdict" id="th-verdict"></div>
  </section>

  <div class="feed">
    <h4><span class="dotpulse"></span> LIVE FLOOR LOG</h4>
    <ul id="log"><li class="empty">waiting for the floor…</li></ul>
  </div>

  <div class="hint">Click a worker for stats · approve their trades below · the log is the floor's real activity</div>
</div>

<script>
"use strict";
const W=1000,H=620,CY=312;
const cvs=document.getElementById("game"),ctx=cvs.getContext("2d");
const DPR=Math.min(window.devicePixelRatio||1,2);
cvs.width=W*DPR;cvs.height=H*DPR;ctx.scale(DPR,DPR);
const rnd=(a,b)=>a+Math.random()*(b-a);

// ── stations: desk rect + stand-spot (sx,sy) in the open aisle ──
const ST={
  research:{label:"RESEARCH LAB",  desk:[70,70,230,90],  sx:185,sy:210, c:"#28e0ff"},
  analysis:{label:"ANALYSIS BAY",  desk:[700,70,230,90], sx:815,sy:210, c:"#7cff6b"},
  risk:    {label:"RISK OFFICE",   desk:[70,460,230,90], sx:185,sy:430, c:"#ff4d77"},
  pit:     {label:"THE PIT",       desk:[700,460,230,90],sx:815,sy:430, c:"#ffd23f"},
  cooler:  {label:"COUNCIL ROOM",  desk:[418,248,164,124], sx:500,sy:430, c:"#ff5fd2"},
};
// seats around the council table — the 3 AIs convene here for a real debate
const COUNCIL_SEATS=[{x:452,y:300},{x:548,y:300},{x:500,y:372}];

const WORKERS=[
  {key:"claude",name:"Claude",role:"News desk · Book A",col:"#ff9d5c",lv:7,pnl:96.40,trades:31,hit:58,edgeP:.55},
  {key:"kimi",  name:"Kimi K2",role:"Cross-source · Book B",col:"#7cc6ff",lv:9,pnl:142.90,trades:24,hit:63,edgeP:.62},
  {key:"gpt",   name:"GPT-5.4",role:"Reasoning · Book C",col:"#74e3a0",lv:6,pnl:21.40,trades:20,hit:52,edgeP:.50},
];
const MKTS=[
  {tk:"FED-DEC-CUT",ti:"Fed cuts in December?",p:62},
  {tk:"CPI-NOV-HOT",ti:"Nov CPI above 3.2%?",p:41},
  {tk:"GDP-Q4-2PCT",ti:"Q4 GDP above 2.0%?",p:55},
  {tk:"OPEC-CUT-JAN",ti:"OPEC cut in January?",p:61},
  {tk:"JOBS-DEC-BEAT",ti:"Dec payrolls beat?",p:48},
];

let frozen=false, output=0, tickets=[], tid=0, selected=null;

// init workers at their desks (they meet in the COUNCIL ROOM only for real debates)
WORKERS.forEach((w,i)=>{
  const home = i===2 ? ST.analysis : ST.research;
  w.x=home.sx + (i*20-20); w.y=home.sy; w.dir=1; w.walk=0; w.path=[];
  w.fsm="rest"; w.timer=0.6+i*1.2; w.dur=w.timer; w.sayText=""; w.sayT=0; w.bob=Math.random()*6; w.councilMsg="";
});

function say(w,t){w.sayText=t;w.sayT=2.4;}
function pathTo(w,sx,sy){
  const p=[];
  if(Math.abs(w.y-CY)>26 && Math.abs(sy-CY)>26){p.push({x:w.x,y:CY});p.push({x:sx,y:CY});}
  p.push({x:sx,y:sy}); w.path=p;
}
function go(w,fsm,stKey){w.fsm=fsm;const s=ST[stKey];pathTo(w,s.sx,s.sy);}

function arrive(w){
  switch(w.fsm){
    case "to_research": w.fsm="work_research"; w.dur=w.timer=rnd(2.4,3.8); say(w,"gathering signal…"); break;
    case "to_analysis": w.fsm="work_analysis"; w.dur=w.timer=rnd(2.2,3.4); say(w,"crunching the numbers…"); break;
    case "to_seat":     w.fsm="at_council"; say(w, w.councilMsg || "let's debate this."); w.dur=w.timer=rnd(4,6); break;
    case "to_pit":      w.fsm="at_pit"; say(w, w.pitMsg || "ship it?"); w.pitMsg=""; w.dur=w.timer=rnd(2,3); break;
    case "to_cooler":   w.fsm="rest"; w.dur=w.timer=rnd(1.8,3); say(w,"quick break."); break;
  }
}
function tickWork(w,dt){
  w.timer-=dt;
  if(w.timer>0) return;
  switch(w.fsm){
    // Ambient desk loop between debates (real meetings are driven by driveFloor).
    case "work_research": go(w,"to_analysis","analysis"); break;
    case "work_analysis": say(w,"scanning for an edge…"); go(w,"to_research","research"); break;
    case "at_pit": go(w,"to_research","research"); break;
    case "rest": go(w,"to_research","research"); break;
    case "at_council": say(w, w.councilMsg || "…"); w.timer=rnd(4,6); break;  // linger until disperse
  }
}
const WORKING=["work_research","work_analysis","at_pit","rest","at_council"];

const SPEED=95;
function update(dt){
  for(const w of WORKERS){
    if(w.sayT>0) w.sayT-=dt;
    if(frozen){ continue; }
    if(w.path.length){
      const t=w.path[0], dx=t.x-w.x, dy=t.y-w.y, d=Math.hypot(dx,dy), step=SPEED*dt;
      if(d<=step){ w.x=t.x; w.y=t.y; w.path.shift(); if(!w.path.length) arrive(w); }
      else { w.x+=dx/d*step; w.y+=dy/d*step; if(Math.abs(dx)>1) w.dir=dx<0?-1:1; w.walk+=dt*10; }
    } else if(WORKING.includes(w.fsm)){
      tickWork(w,dt); w.bob+=dt*4;
    }
  }
}

// ── drawing ───────────────────────────────────────────
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function drawFloor(){
  // carpet
  ctx.fillStyle="#0c1119"; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(255,255,255,.025)"; ctx.lineWidth=1;
  for(let x=0;x<=W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // aisle band
  ctx.fillStyle="rgba(77,208,255,.04)"; ctx.fillRect(0,CY-46,W,92);
}
function drawStation(s){
  const [x,y,w,h]=s.desk;
  // zone glow
  ctx.fillStyle=s.c+"14"; roundRect(x-16,y-14,w+32,h+58,16); ctx.fill();
  // desk
  ctx.fillStyle="#1b2533"; roundRect(x,y,w,h,10); ctx.fill();
  ctx.strokeStyle=s.c+"55"; ctx.lineWidth=1.5; ctx.stroke();
  // monitor glow
  ctx.fillStyle=s.c+"33"; roundRect(x+w/2-34,y+h/2-16,68,30,5); ctx.fill();
  ctx.fillStyle=s.c; ctx.fillRect(x+w/2-30,y+h/2-12,5,22);
  // label
  ctx.font="700 13px "+"'Bricolage Grotesque',sans-serif"; ctx.fillStyle=s.c;
  ctx.textAlign="center"; ctx.fillText(s.label,x+w/2,y-22);
  ctx.textAlign="start";
}
function drawWorker(w){
  const bobbing = w.path.length>0;
  const yo = bobbing ? Math.sin(w.walk)*2 : Math.sin(w.bob)*1.2;
  const x=w.x, y=w.y+yo;
  // shadow
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(w.x,w.y+20,15,5,0,0,7); ctx.fill();
  // selection ring
  if(selected===w){ctx.strokeStyle=w.col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(w.x,w.y+4,24,0,7);ctx.stroke();}
  // legs (walk cycle)
  const lp = bobbing?Math.sin(w.walk)*4:0;
  ctx.fillStyle="#11151c";
  roundRect(x-7,y+10,5,12+lp,2);ctx.fill(); roundRect(x+2,y+10,5,12-lp,2);ctx.fill();
  // body
  ctx.fillStyle=w.col; roundRect(x-11,y-8,22,22,7); ctx.fill();
  // little badge dot
  ctx.fillStyle="rgba(0,0,0,.25)"; ctx.beginPath();ctx.arc(x+(w.dir>0?5:-5),y+2,2.5,0,7);ctx.fill();
  // head
  ctx.fillStyle="#f3ead9"; ctx.beginPath();ctx.arc(x,y-14,9,0,7);ctx.fill();
  // eyes (face dir)
  ctx.fillStyle="#1a1f29"; const ex=w.dir>0?2:-2;
  ctx.beginPath();ctx.arc(x-3+ex,y-15,1.5,0,7);ctx.arc(x+3+ex,y-15,1.5,0,7);ctx.fill();
  // name tag
  ctx.font="600 11px "+"'IBM Plex Mono',monospace"; ctx.textAlign="center";
  ctx.fillStyle="rgba(8,12,18,.8)"; const tw=ctx.measureText(w.name).width;
  roundRect(x-tw/2-5,y+26,tw+10,15,4); ctx.fill();
  ctx.fillStyle=w.col; ctx.fillText(w.name,x,y+37);
  // work progress bar
  if(["work_research","work_analysis","at_pit"].includes(w.fsm) && w.path.length===0){
    const pr=1-Math.max(w.timer,0)/w.dur;
    ctx.fillStyle="rgba(255,255,255,.12)"; roundRect(x-16,y-30,32,5,3); ctx.fill();
    ctx.fillStyle=w.col; roundRect(x-16,y-30,32*pr,5,3); ctx.fill();
  }
  // speech bubble
  if(w.sayT>0){
    ctx.font="500 12px "+"'IBM Plex Mono',monospace";
    const bw=ctx.measureText(w.sayText).width+18, bx=x-bw/2, by=y-58;
    ctx.fillStyle="rgba(16,21,30,.97)"; ctx.strokeStyle=w.col+"66"; ctx.lineWidth=1;
    roundRect(bx,by,bw,24,8); ctx.fill(); ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-5,by+24);ctx.lineTo(x+5,by+24);ctx.lineTo(x,by+31);ctx.fill();
    ctx.fillStyle="#dfe7f2"; ctx.fillText(w.sayText,x,by+16);
  }
  ctx.textAlign="start";
}
function draw(){
  drawFloor();
  for(const k in ST) drawStation(ST[k]);
  // draw workers sorted by y for depth
  [...WORKERS].sort((a,b)=>a.y-b.y).forEach(drawWorker);
  if(frozen){
    ctx.fillStyle="rgba(255,93,93,.06)"; ctx.fillRect(0,0,W,H);
    ctx.font="800 22px 'Bricolage Grotesque',sans-serif"; ctx.fillStyle="#ff5d5d"; ctx.textAlign="center";
    ctx.fillText("— LINE STOPPED —",W/2,40); ctx.textAlign="start";
  }
}

let last=performance.now();
function loop(t){
  let dt=(t-last)/1000; last=t; if(dt>0.05)dt=0.05;
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ── dock (approvals) ──────────────────────────────────
function renderDock(){
  const d=document.getElementById("dock");
  if(!tickets.length){d.innerHTML=`<div class="pit-empty">THE PIT IS EMPTY — workers are still digging for edges.</div>`;return;}
  d.innerHTML=tickets.map(t=>`
    <div class="ticket" data-id="${t.id}">
      <div class="top"><span class="who">${t.who}</span><span class="side ${t.side}">${t.side.toUpperCase()}</span></div>
      <div class="ti">${t.ti}</div>
      <div class="meta">${t.tk} · ${t.contracts} @ ${Math.round(t.price*100)}¢</div>
      <div class="acts"><button class="ship" data-a="1">SHIP IT</button><button class="reject" data-a="0">REJECT</button></div>
    </div>`).join("");
}
renderDock();
document.getElementById("dock").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-a]"); if(!b) return;
  const card=b.closest(".ticket"), id=+card.dataset.id, granted=b.dataset.a==="1";
  const t=tickets.find(x=>x.id===id), w=t&&WORKERS.find(x=>x.key===t.key);
  if(w) say(w, granted?"booked it!":"rejected. back to it.");
  b.disabled=true;
  try{ await fetch("/api/floor/approve",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({id,granted})}); }catch(_){}
  poll();
});

// ── interactions ──────────────────────────────────────
function toWorld(e){const r=cvs.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cvs.addEventListener("click",e=>{
  const p=toWorld(e); selected=null;
  for(const w of WORKERS){ if(Math.hypot(p.x-w.x,p.y-w.y-2)<26){selected=w;break;} }
  const tip=document.getElementById("tip");
  if(selected){
    tip.style.display="block";
    tip.style.left=Math.min(e.offsetX,cvs.clientWidth-180)+"px";
    tip.style.top=Math.max(e.offsetY-90,0)+"px";
    const w=selected;
    tip.innerHTML=`<div class="nm" style="color:${w.col}">${w.name}</div><div class="rl">${w.role}</div>
      <div class="r"><span>Level</span><span>L${w.lv}</span></div>
      <div class="r"><span>P&amp;L</span><span style="color:${w.pnl>=0?'var(--up)':'var(--down)'}">${(w.pnl<0?'−$':'$')+Math.abs(w.pnl).toFixed(2)}</span></div>
      <div class="r"><span>Trades</span><span>${w.trades}</span></div>
      <div class="r"><span>Hit rate</span><span>${w.hit}%</span></div>`;
  } else tip.style.display="none";
});

function reflectStop(){
  document.getElementById("stop").setAttribute("aria-pressed",String(frozen));
  const m=document.getElementById("mode");
  m.textContent=frozen?"HALTED":"PAPER";
  m.style.cssText=frozen?"border-color:var(--down);color:var(--down);background:rgba(255,93,93,.1)":"";
}
document.getElementById("stop").addEventListener("click",async ()=>{
  frozen=!frozen; reflectStop();
  WORKERS.forEach(w=>say(w,frozen?"line stopped.":"back to the grind."));
  try{ await fetch("/api/floor/stop",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({frozen})}); }catch(_){}
});

// ── live floor polling (server is the source of truth) ─
async function poll(){
  try{
    const r=await fetch("/api/floor"); if(!r.ok) return;
    const d=await r.json();
    output=d.output;
    document.getElementById("out").textContent=(d.output<0?"−$":"$")+Math.abs(d.output).toFixed(2);
    d.books.forEach(b=>{const w=WORKERS.find(x=>x.key===b.key);
      if(w){w.pnl=b.pnl; w.trades=b.trades; if(b.hit!=null)w.hit=b.hit;}});
    tickets=d.tickets;
    renderDock();
    driveFloor(d);
    renderFeed(d.activity||[]);
    renderDebate(d.debate);
    if(d.frozen!==frozen){frozen=d.frozen; reflectStop();}
    reflectToggles(d);
  }catch(_){ /* server not running — the floor stays idle */ }
}

function classifyEvent(s){
  if(/LIVE ORDER PLACED|SHIPPED/.test(s)) return "ev-order";
  if(/ORDER FAILED/.test(s))               return "ev-fail";
  if(/RISK BLOCKED|loss halt|kill switch/.test(s)) return "ev-risk";
  if(/model error|failed|cap .*reached|DISARMED/.test(s)) return "ev-warn";
  return "";
}

// ── floor choreography: drive the AIs from the REAL debate, not random ──
// On each NEW debate the three AIs walk into the COUNCIL ROOM, sit around the table
// and show their actual roundtable line; after they've deliberated they disperse — to
// THE PIT if the council decided to PLACE, back to their desks if it was a SKIP.
let _lastConvene=null;
function driveFloor(d){
  const dz=d.debate; if(!dz) return;
  const id=dz.market_id+"|"+(dz.round2||[]).map(t=>t.p).join(",");
  if(id===_lastConvene) return;
  _lastConvene=id;
  convene(dz);
}
function convene(dz){
  const byName=Object.fromEntries((dz.round2||[]).map(t=>[t.model,t]));
  WORKERS.forEach((w,i)=>{
    const t=byName[w.name];
    if(t){ const s=String(t.thesis).replace(/\s*P\(YES\).*$/is,"").trim();
           w.councilMsg=`${s.slice(0,44)} (${Math.round(t.p*100)}%)`; }
    else { w.councilMsg="thinking…"; }
    const seat=COUNCIL_SEATS[i%COUNCIL_SEATS.length];
    w.fsm="to_seat"; pathTo(w, seat.x, seat.y);
  });
  clearTimeout(window._disperseT);
  window._disperseT=setTimeout(()=>disperse(dz.decision), 7000);
}
function disperse(dec){
  WORKERS.forEach((w,i)=>{
    if(dec && dec.place){ w.pitMsg=`${(dec.side||"").toUpperCase()} — ship it!`; w.fsm="to_pit"; pathTo(w, ST.pit.sx, ST.pit.sy); }
    else { const k=i%2?"analysis":"research"; w.fsm=i%2?"to_analysis":"to_research"; pathTo(w, ST[k].sx, ST[k].sy); say(w,"no edge — back to it"); }
  });
}
function renderFeed(activity){
  const ul=document.getElementById("log");
  if(!activity.length){ ul.innerHTML=`<li class="empty">floor is quiet — no activity yet.</li>`; return; }
  ul.innerHTML=activity.map(a=>`<li class="${classifyEvent(a.s)}"><span class="ts">${a.t}</span><span>${a.s}</span></li>`).join("");
}

function renderDebate(dz){
  const sec=document.getElementById("theater");
  if(!dz){ sec.hidden=true; return; }
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.getElementById("th-market").textContent=dz.market_id;
  // round2 is the roundtable transcript, in speaking order (last speaker = most capable).
  const turns=dz.round2, n=turns.length;
  const strip=s=>String(s).replace(/\s*P\(YES\)\s*:?.*/is,"").trim();  // hide the trailing P(YES): line
  document.getElementById("th-cols").innerHTML=turns.map((e,i)=>`
    <div class="turn" data-model="${e.model}">
      <div class="hd"><span class="nm">${e.model}</span>${i===n-1?'<span class="last">CLOSES</span>':''}
        <span class="pv">${(e.p*100).toFixed(0)}%</span></div>
      <div class="msg">${strip(e.thesis)||e.thesis}</div>
    </div>`).join("");
  const v=document.getElementById("th-verdict"), dec=dz.decision;
  v.className="verdict "+(dec.place?"place":"skip");
  v.textContent=dec.place
    ? `PLACE ${dec.side.toUpperCase()} ${dec.contracts} @ ${dec.cents}¢ · ${dec.reason}`
    : `SKIP · ${dec.reason}`;
  const wasHidden=sec.hidden; sec.hidden=false;
  if(!reduce && wasHidden && window.anime){
    anime({targets:"#th-cols .turn",opacity:[0,1],translateY:[8,0],delay:anime.stagger(90),duration:260,easing:"easeOutQuad"});
    anime({targets:"#th-verdict",opacity:[0,1],scale:[0.96,1],duration:240,easing:"easeOutBack"});
  }
}

function reflectToggles(d){
  const a=document.getElementById("auto"), lv=document.getElementById("live"), mode=document.getElementById("mode");
  a.classList.toggle("on", d.auto); a.setAttribute("aria-pressed",String(d.auto));
  a.textContent="AUTO: "+(d.auto?"ON":"OFF");
  lv.classList.toggle("live-on", d.live); lv.setAttribute("aria-pressed",String(d.live));
  lv.textContent = d.live ? `LIVE · ${d.calls} calls` : "MODE: MOCK";
  const arm=document.getElementById("arm");
  arm.classList.toggle("arm-on", !!d.execute); arm.setAttribute("aria-pressed",String(!!d.execute));
  arm.textContent = d.execute ? "● LIVE TRADING" : "ARM $";
  if(!frozen) mode.textContent = d.execute ? "LIVE $$$" : d.live ? "LIVE" : "PAPER";
}
document.getElementById("auto").addEventListener("click",async ()=>{
  const on=document.getElementById("auto").getAttribute("aria-pressed")!=="true";
  try{ await fetch("/api/floor/auto",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({on})}); }catch(_){}
  poll();
});
document.getElementById("live").addEventListener("click",async ()=>{
  const on=document.getElementById("live").getAttribute("aria-pressed")!=="true";
  if(on && !confirm("Turn ON live mode? This runs the REAL models (Claude/Kimi/GLM) and spends OpenRouter tokens. Your $15 balance is the hard cap.")) return;
  try{ await fetch("/api/floor/live",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({on})}); }catch(_){}
  poll();
});
document.getElementById("arm").addEventListener("click",async ()=>{
  const on=document.getElementById("arm").getAttribute("aria-pressed")!=="true";
  if(on && !confirm("ARM REAL-MONEY auto-execution?\n\nThe council will place REAL orders on your Kalshi account automatically, with NO approval step. Only the risk caps and the kill switch protect your balance. Requires COUNCIL_MODE=live in .env.\n\nContinue?")) return;
  try{
    const r=await fetch("/api/floor/arm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({on})});
    if(!r.ok){const j=await r.json().catch(()=>({})); alert("Could not arm: "+(j.detail||("HTTP "+r.status)));}
  }catch(_){}
  poll();
});
setInterval(poll,2500); poll();

// ── cosmetic-only arcade flourish (no game logic touched) ──
(function arcadeIntro(){
  if(!window.anime || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  anime.timeline({easing:"easeOutQuad"})
    .add({targets:".logo",translateY:[-18,0],opacity:[0,1],duration:420})
    .add({targets:"header .mode, header .out, header .toggle, header .stop",
          translateY:[-12,0],opacity:[0,1],delay:anime.stagger(60),duration:260}, "-=200")
    .add({targets:"canvas",scale:[0.985,1],opacity:[0,1],duration:380}, "-=200");
  // gentle idle bob on the logo mark, like an attract-mode title
  anime({targets:".logo b",translateY:[0,-3],direction:"alternate",loop:true,
         duration:700,easing:"easeInOutSine"});
})();
</script>
